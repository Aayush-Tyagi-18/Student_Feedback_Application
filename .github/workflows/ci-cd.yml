name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI: runs on every push and pull request
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint index.html admin.html

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js

      - name: Run unit tests
        run: node --test

      - name: Package site
        run: |
          mkdir dist
          cp index.html admin.html style.css script.js admin.js dist/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # CD: deploys to GitHub Pages, only from main and only if CI passed
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
