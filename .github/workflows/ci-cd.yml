name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # CI: runs on every push and pull request
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint index.html admin.html

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check admin.js

      - name: Run unit tests
        run: node --test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Maven build
        run: mvn -B clean package -DskipNodeTests=true

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-feedback-war
          path: target/*.war

      - name: Package site
        run: |
          mkdir dist
          cp index.html admin.html style.css script.js admin.js dist/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Builds the Docker image and smoke-tests the container
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t student-feedback-app:latest .

      - name: Run container and smoke test
        run: |
          docker run -d --name feedback -p 8080:8080 student-feedback-app:latest
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/ > /dev/null && break
            sleep 2
          done
          curl -fs http://localhost:8080/ | grep -i "Student Feedback"
          docker ps

  # CD: deploys to GitHub Pages, only from main and only if CI passed
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
