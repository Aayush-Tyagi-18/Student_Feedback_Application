<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin panel - Student Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Admin panel</h1>
      <p class="lead">Review the feedback students have submitted.</p>
    </header>

    <form id="login-form" novalidate>
      <label for="passcode">Admin passcode</label>
      <input type="password" id="passcode" autocomplete="current-password" required>
      <p id="login-error" class="error" role="alert" hidden></p>
      <button type="submit">Sign in</button>
    </form>

    <section id="panel" aria-labelledby="list-heading" hidden>
      <div class="list-head">
        <h2 id="list-heading">Submitted feedback <span id="count">(0)</span></h2>
        <div class="toolbar">
          <button type="button" id="export-btn" class="btn">Export CSV</button>
          <button type="button" id="logout-btn" class="btn">Sign out</button>
          <button type="button" id="clear-btn" class="link-btn">Clear all</button>
        </div>
      </div>
      <p id="empty" class="empty">No feedback yet. New submissions will appear here.</p>
      <ul id="feedback-list"></ul>
    </section>

    <p class="footer"><a href="index.html">Back to the feedback form</a></p>
  </main>
  <script src="admin.js"></script>
</body>
</html>
