<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header>
      <h1>Student Feedback</h1>
      <p class="lead">Tell us how your course is going. Your feedback goes to the course admin.</p>
    </header>

    <form id="feedback-form" novalidate>
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" autocomplete="name" required>

      <label for="course">Course</label>
      <input type="text" id="course" name="course" placeholder="e.g. Data Structures" required>

      <label for="feedback">Feedback</label>
      <textarea id="feedback" name="feedback" rows="4" required></textarea>

      <p id="form-error" class="error" role="alert" hidden></p>
      <p id="form-success" class="success" role="status" hidden></p>
      <button type="submit">Submit feedback</button>
    </form>

    <p class="footer"><a href="admin.html">Admin panel</a></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
